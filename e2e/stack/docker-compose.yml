# Self-contained spatial stack for the e2e tests: PostGIS + GeoServer + spatial-service + spatial-hub
# behind one nginx origin (http://localhost:${E2E_PORT:-18080}): / -> hub, /ws -> service, /geoserver -> GeoServer.
# Images are overridable so the same stack tests a release or a branch build:
#   SPATIAL_SERVICE_IMAGE, SPATIAL_HUB_IMAGE (defaults: published 3.x images)
name: spatial-e2e
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    environment:
      POSTGRES_DB: layersdb
      POSTGRES_USER: layers
      POSTGRES_PASSWORD: layers
    volumes:
      - ./postgres/init_layersdb.sql:/docker-entrypoint-initdb.d/10-init_layersdb.sql:ro
      - ./postgres/fixtures-states.sql:/docker-entrypoint-initdb.d/20-fixtures-states.sql:ro
      - ./postgres/fixtures-env.sql:/docker-entrypoint-initdb.d/30-fixtures-env.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U layers -d layersdb"]
      interval: 5s
      retries: 20

  geoserver:
    image: kartoza/geoserver:2.28.3
    environment:
      GEOSERVER_ADMIN_USER: admin
      GEOSERVER_ADMIN_PASSWORD: geoserver
      GEOSERVER_DATA_DIR: /data/geoserver_data_dir
      INITIAL_MEMORY: 512M
      MAXIMUM_MEMORY: 1536M
      RUN_AS_ROOT: "true"
    volumes:
      - geoserver_data:/data/geoserver_data_dir
      - spatial_data:/data/spatial-data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf -u admin:geoserver http://localhost:8080/geoserver/rest/about/version.json >/dev/null"]
      interval: 10s
      retries: 30

  geoserver-init:
    image: curlimages/curl:8.11.1
    depends_on:
      geoserver: {condition: service_healthy}
      postgres: {condition: service_healthy}
    volumes:
      - ./geoserver:/init:ro
    entrypoint: ["sh", "/init/init.sh"]
    restart: "no"

  # the translations ala-i18n ships (same image la-docker-compose uses); docker fills the volume from the image on first use
  i18n:
    image: livingatlases/ala-i18n:latest
    volumes:
      - i18n_data:/opt/atlas/i18n
    restart: "no"

  # synthetic environmental grids (fixtures/make-grids.py) into the data volume, owned by the service user
  grids-init:
    image: alpine:3.20
    user: root
    volumes:
      - ./fixtures/grids:/grids:ro
      - spatial_data:/data/spatial-data
    command: ["sh", "-c", "mkdir -p /data/spatial-data/layer /data/spatial-data/standard_layer/0.5 && cp -f /grids/* /data/spatial-data/layer/ && cp -f /grids/* /data/spatial-data/standard_layer/0.5/ && for e in grd gri; do cp -f /grids/e2e_temp.$$e /data/spatial-data/standard_layer/0.5/el9001.$$e; cp -f /grids/e2e_rain.$$e /data/spatial-data/standard_layer/0.5/el9002.$$e; done && chown -R 1000:1000 /data/spatial-data"]
    restart: "no"

  # maxent.jar for the Predict task, from the same place and version as ala-install's spatial-service role (not
  # redistributed here). A failed download only means Predict cannot run: the other specs do not need it.
  # ala-install pins 3.4.3, which fails here with "ClassCastException: [D cannot be cast to [F" in Extractor.extractSample
  # (3.4.1, 3.3.3k and 3.4.4 run the same inputs), so the stack defaults to 3.4.4; MAXENT_VERSION=3.4.3 reproduces it.
  maxent-init:
    image: alpine:3.20
    user: root
    environment:
      MAXENT_VERSION: ${MAXENT_VERSION:-3.4.4}
    volumes:
      - spatial_data:/data/spatial-data
    command:
      - sh
      - -c
      - |
        d=/data/spatial-data/modelling/maxent; mkdir -p $$d
        [ -s $$d/maxent.jar ] || wget -q -O $$d/maxent.jar "https://raw.githubusercontent.com/mrmaxent/Maxent/master/ArchivedReleases/$$MAXENT_VERSION/maxent.jar" || { echo "maxent.jar not downloaded: Predict will not run"; rm -f $$d/maxent.jar; }
        chown -R 1000:1000 /data/spatial-data/modelling
    restart: "no"

  biocache:
    image: python:3.12-alpine
    volumes:
      - ./biocache-stub/stub.py:/stub.py:ro
    command: ["python", "/stub.py"]

  oidc:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    environment:
      JSON_CONFIG_PATH: /config/mock-oidc.json
    volumes:
      - ./config/mock-oidc.json:/config/mock-oidc.json:ro
    ports:
      - "${E2E_OIDC_PORT:-18081}:8080"

  spatial-service:
    image: ${SPATIAL_SERVICE_IMAGE:-livingatlases/spatial-service:3.1.0}
    extra_hosts: ["e2e.localhost:host-gateway"]
    depends_on:
      geoserver-init: {condition: service_completed_successfully}
      biocache: {condition: service_started}
      i18n: {condition: service_completed_successfully}
      grids-init: {condition: service_completed_successfully}
      maxent-init: {condition: service_completed_successfully}
    volumes:
      - ./config/spatial-service-config.yml:/data/spatial-service/config/spatial-service-config.yml:ro
      - ./config/logback.xml:/data/spatial-service/config/logback.xml:ro
      - i18n_data:/opt/atlas/i18n:ro
      - geoserver_data:/data/geoserver_data_dir
      - spatial_data:/data/spatial-data
    environment:
      JAVA_OPTS: -Xmx1g -Dlogging.config=/data/spatial-service/config/logback.xml -Dspring.config.additional-location=/data/spatial-service/config/ -Dspring.config.name=application,spatial-service-config
    # run the war exploded: task specs are found by listing the classpath dir /processes/ (see la-docker-compose)
    command:
      - sh
      - -c
      - |
        set -e
        war=/opt/atlas/spatial-service/app.war; app=/tmp/spatial-service-app; rm -rf "$$app"
        java -cp "$$war" -Dloader.path=WEB-INF/lib,WEB-INF/lib-provided -Dloader.main=groovy.ui.GroovyMain \
          org.springframework.boot.loader.PropertiesLauncher -e '
            def z = new java.util.zip.ZipFile(args[0]); def d = new File(args[1])
            z.entries().each { e -> def f = new File(d, e.name)
              if (e.directory) f.mkdirs() else { f.parentFile.mkdirs(); f.withOutputStream { o -> o << z.getInputStream(e) } } }' \
          "$$war" "$$app"
        exec java $$JAVA_OPTS -cp "$$app" org.springframework.boot.loader.WarLauncher

  spatial-hub:
    image: ${SPATIAL_HUB_IMAGE:-livingatlases/spatial-hub:3.2.1}
    extra_hosts: ["e2e.localhost:host-gateway"]
    depends_on:
      spatial-service: {condition: service_started}
      oidc: {condition: service_started}
      i18n: {condition: service_completed_successfully}
    volumes:
      - ./config/spatial-hub-config.yml:/data/spatial-hub/config/spatial-hub-config.yml:ro
      - ./config/logback.xml:/data/spatial-hub/config/logback.xml:ro
      - i18n_data:/opt/atlas/i18n:ro
    environment:
      JAVA_OPTS: -Xmx1g -Dlogging.config=/data/spatial-hub/config/logback.xml -Dspring.config.additional-location=/data/spatial-hub/config/ -Dspring.config.name=application,spatial-hub-config

  nginx:
    image: nginx:1.30-alpine
    depends_on: [spatial-hub, spatial-service, geoserver]
    ports:
      - "${E2E_PORT:-18080}:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  geoserver_data:
  spatial_data:
  i18n_data:
